# Mise à jour automatique des tirages (Keno, EuroMillions, Loto, EuroDreams).
#
# DÉCLENCHEMENT : 21h40 heure de Paris toute l'année.
# GitHub Actions tourne en UTC, donc on programme deux crons (19h40 UTC pour
# l'heure d'été UTC+2, 20h40 UTC pour l'heure d'hiver UTC+1) et un garde-fou
# arrête celui qui ne correspond pas à la saison en cours. Résultat : toujours
# exactement un vrai passage par jour, après TOUS les tirages du soir et une
# fois que la FDJ a publié son archive (Keno soir 20h, Loto/EuroMillions
# 20h45-21h, EuroDreams selon les jours).
#
# CRÉDITS NETLIFY : le commit (et donc le déploiement) n'a lieu QUE si les
# données ont réellement changé -> pas de build les jours sans nouveau tirage.

name: Mise à jour des tirages

on:
  schedule:
    - cron: "40 19 * * *"   # 21h40 heure française d'été (UTC+2)
    - cron: "40 20 * * *"   # 21h40 heure française d'hiver (UTC+1)
  workflow_dispatch: {}     # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Ne garder que le passage correspondant à l'heure de Paris
        id: gate
        run: |
          HEURE_PARIS=$(TZ=Europe/Paris date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HEURE_PARIS" = "21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Passage hors saison (${HEURE_PARIS}h a Paris) — on s'arrete."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Régénérer les JSON de tirages
        if: steps.gate.outputs.run == 'true'
        run: python tools/update_data.py

      - name: Générer les pages SEO par numéro + sitemap
        if: steps.gate.outputs.run == 'true'
        run: python tools/generate_pages.py

      - name: Committer UNIQUEMENT si les données ont changé
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "tirages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/*.json data-private/*.json site/keno site/euromillions site/loto site/eurodreams site/sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun nouveau tirage — pas de commit, pas de deploiement Netlify."
            exit 0
          fi
          git commit -m "data: tirages du $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
